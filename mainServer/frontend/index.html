<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('gather-theme'); } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        let lang;
        try { lang = localStorage.getItem('gather-lang'); } catch {}
        if (lang !== 'en' && lang !== 'fa') {
          lang = (navigator.language || 'en').toLowerCase().startsWith('fa') ? 'fa' : 'en';
        }
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142820" />
    <meta name="description" content="Discover products, manage your cart, and get help from your smart shopping assistant." />
    <title>Gather — Smart shopping</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
